name: Analisis de secretos con Gitleaks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Gitleaks - Secrets
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar resultados
        run: mkdir -p "$RUNNER_TEMP/gitleaks-results"

      - name: Verificar reglas
        run: test -f .github/gitleaks/gitleaks.toml

      - name: Ejecutar Gitleaks y generar JSON
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/gitleaks-results:/results" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/workspace \
            --no-git \
            --config=/workspace/.github/gitleaks/gitleaks.toml \
            --report-format=json \
            --report-path=/results/gitleaks.json \
            --redact=100 \
            --exit-code=0

      - name: Ejecutar Gitleaks y generar SARIF
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/gitleaks-results:/results" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/workspace \
            --no-git \
            --config=/workspace/.github/gitleaks/gitleaks.toml \
            --report-format=sarif \
            --report-path=/results/gitleaks.sarif \
            --redact=100 \
            --exit-code=0

      - name: Ocultar secretos en los reportes
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          results_dir = Path(os.environ["RUNNER_TEMP"]) / "gitleaks-results"
          json_path = results_dir / "gitleaks.json"
          sarif_path = results_dir / "gitleaks.sarif"

          findings = json.loads(json_path.read_text(encoding="utf-8"))
          secrets = {
              finding.get("Secret")
              for finding in findings
              if isinstance(finding, dict)
              and isinstance(finding.get("Secret"), str)
              and finding["Secret"]
          }

          def redact(value):
              if isinstance(value, str):
                  for secret in secrets:
                      value = value.replace(secret, "[REDACTED]")
                  return value
              if isinstance(value, list):
                  return [redact(item) for item in value]
              if isinstance(value, dict):
                  return {key: redact(item) for key, item in value.items()}
              return value

          json_path.write_text(
              json.dumps(redact(findings), indent=2),
              encoding="utf-8",
          )

          sarif = json.loads(sarif_path.read_text(encoding="utf-8"))
          sarif_path.write_text(
              json.dumps(redact(sarif), indent=2),
              encoding="utf-8",
          )

          print(f"Hallazgos encontrados: {len(findings)}")
          print("Los valores de los secretos se ocultaron en los reportes.")

      - name: Publicar resultados como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-secrets-results
          path: |
            ${{ runner.temp }}/gitleaks-results/gitleaks.json
            ${{ runner.temp }}/gitleaks-results/gitleaks.sarif
          if-no-files-found: warn

      - name: Publicar alertas en Code Scanning
        if: success() && hashFiles(format('{0}/gitleaks-results/gitleaks.sarif', runner.temp)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-results/gitleaks.sarif
          category: gitleaks-secrets

      - name: Enviar resultados a DefectDojo
        if: github.event_name != 'pull_request'
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DD_PRODUCT_TYPE: ${{ secrets.DEFECTDOJO_PRODUCT_TYPE_NAME }}
          DD_PRODUCT: ${{ secrets.DEFECTDOJO_PRODUCT_NAME }}
          DD_ENGAGEMENT: ${{ secrets.DEFECTDOJO_ENGAGEMENT_NAME }}
        run: |
          REPORT="$RUNNER_TEMP/gitleaks-results/gitleaks.json"

          test -s "$REPORT" || {
            echo "::error::No se generó gitleaks.json"
            exit 1
          }
          [ -n "$DD_URL" ] || {
            echo "::error::Falta DEFECTDOJO_URL en el entorno Dev"
            exit 1
          }
          [ -n "$DD_TOKEN" ] || {
            echo "::error::Falta DEFECTDOJO_API_TOKEN en el entorno Dev"
            exit 1
          }
          [ -n "$DD_PRODUCT_TYPE" ] || {
            echo "::error::Falta DEFECTDOJO_PRODUCT_TYPE_NAME en el entorno Dev"
            exit 1
          }
          [ -n "$DD_PRODUCT" ] || {
            echo "::error::Falta DEFECTDOJO_PRODUCT_NAME en el entorno Dev"
            exit 1
          }
          [ -n "$DD_ENGAGEMENT" ] || {
            echo "::error::Falta DEFECTDOJO_ENGAGEMENT_NAME en el entorno Dev"
            exit 1
          }

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Enviando Gitleaks: $DD_PRODUCT / $DD_ENGAGEMENT / $BRANCH"

          curl --fail-with-body --silent --show-error \
            --request POST \
            "${DD_URL%/}/api/v2/reimport-scan/" \
            --header "Authorization: Token $DD_TOKEN" \
            --form "scan_type=Gitleaks" \
            --form "product_type_name=$DD_PRODUCT_TYPE" \
            --form "product_name=$DD_PRODUCT" \
            --form "engagement_name=$DD_ENGAGEMENT" \
            --form "test_title=Gitleaks $BRANCH" \
            --form "auto_create_context=true" \
            --form "branch_tag=$BRANCH" \
            --form "commit_hash=$GITHUB_SHA" \
            --form "file=@$REPORT;type=application/json"
