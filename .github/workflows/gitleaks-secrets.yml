name: Analisis de secretos con Gitleaks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks - Secrets
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Verificar reglas
        run: test -f .github/gitleaks/gitleaks.toml

      - name: Preparar resultados
        run: mkdir -p "$RUNNER_TEMP/gitleaks-results"

      - name: Ejecutar Gitleaks
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/gitleaks-results:/results" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/workspace \
            --no-git \
            --config=/workspace/.github/gitleaks/gitleaks.toml \
            --report-format=json \
            --report-path=/results/gitleaks.json \
            --redact=100 \
            --exit-code=0

      - name: Ocultar secretos del reporte
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "gitleaks-results"
              / "gitleaks.json"
          )

          findings = json.loads(report_path.read_text(encoding="utf-8"))
          secrets = {
              finding.get("Secret")
              for finding in findings
              if isinstance(finding, dict)
              and isinstance(finding.get("Secret"), str)
              and finding["Secret"]
          }

          def redact(value):
              if isinstance(value, str):
                  for secret in secrets:
                      value = value.replace(secret, "[REDACTED]")
                  return value
              if isinstance(value, list):
                  return [redact(item) for item in value]
              if isinstance(value, dict):
                  return {key: redact(item) for key, item in value.items()}
              return value

          report_path.write_text(
              json.dumps(redact(findings), indent=2),
              encoding="utf-8",
          )

          print(f"Hallazgos detectados: {len(findings)}")
          print("Valores secretos ocultos en el reporte.")

      - name: Fallar si se encontraron secretos
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "gitleaks-results"
              / "gitleaks.json"
          )
          findings = json.loads(report_path.read_text(encoding="utf-8"))

          if findings:
              print(
                  f"::error::Gitleaks encontró {len(findings)} hallazgo(s). "
                  "Se guardará el reporte redactado como artefacto; "
                  "no se enviará a DefectDojo."
              )
              raise SystemExit(1)

          print("Gitleaks no encontró secretos.")

      - name: Guardar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-secrets-results
          path: ${{ runner.temp }}/gitleaks-results/gitleaks.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enviar resultados a DefectDojo
        if: >-
          success() &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DD_PRODUCT_TYPE: ${{ secrets.DEFECTDOJO_PRODUCT_TYPE_NAME }}
          DD_PRODUCT: ${{ secrets.DEFECTDOJO_PRODUCT_NAME }}
          DD_ENGAGEMENT: ${{ secrets.DEFECTDOJO_ENGAGEMENT_NAME }}
          DD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/gitleaks-results/gitleaks.json"

          test -s "$REPORT" || {
            echo "::error::No se generó gitleaks.json"
            exit 1
          }

          [ -n "$DD_URL" ] || { echo "::error::Falta DEFECTDOJO_URL en Dev"; exit 1; }
          [ -n "$DD_TOKEN" ] || { echo "::error::Falta DEFECTDOJO_API_TOKEN en Dev"; exit 1; }
          [ -n "$DD_PRODUCT_TYPE" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_TYPE_NAME en Dev"; exit 1; }
          [ -n "$DD_PRODUCT" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_NAME en Dev"; exit 1; }
          [ -n "$DD_ENGAGEMENT" ] || { echo "::error::Falta DEFECTDOJO_ENGAGEMENT_NAME en Dev"; exit 1; }

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Enviando Gitleaks: $DD_PRODUCT / $DD_ENGAGEMENT / $BRANCH"

          curl --fail-with-body --silent --show-error \
            --request POST \
            "${DD_URL%/}/api/v2/reimport-scan/" \
            --header "Authorization: Token $DD_TOKEN" \
            --form "scan_type=Gitleaks Scan" \
            --form "product_type_name=$DD_PRODUCT_TYPE" \
            --form "product_name=$DD_PRODUCT" \
            --form "engagement_name=$DD_ENGAGEMENT" \
            --form "test_title=Gitleaks $BRANCH" \
            --form "auto_create_context=true" \
            --form "branch_tag=$BRANCH" \
            --form "commit_hash=$DD_COMMIT" \
            --form "file=@$REPORT;type=application/json"
