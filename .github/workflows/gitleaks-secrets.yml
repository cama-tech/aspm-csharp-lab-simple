name: Analisis de secretos con Gitleaks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks - Secrets
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar reglas
        run: test -f .github/gitleaks/gitleaks.toml

      - name: Preparar resultados
        run: mkdir -p "$RUNNER_TEMP/gitleaks-results"

      - name: Escanear cambios con Gitleaks
        id: scan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          REPORT_DIR="$RUNNER_TEMP/gitleaks-results"
          REPORT="$REPORT_DIR/gitleaks.json"

          if [[ "$EVENT_NAME" == "pull_request" ]] &&
             [[ -n "$BASE_SHA" ]] &&
             [[ -n "$HEAD_SHA" ]]; then
            echo "Escaneando cambios del PR: $BASE_SHA..$HEAD_SHA"

            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$REPORT_DIR:/results" \
              zricethezav/gitleaks:latest \
              git \
              --config=/workspace/.github/gitleaks/gitleaks.toml \
              --log-opts="--all ${BASE_SHA}..${HEAD_SHA}" \
              --report-format=json \
              --report-path=/results/gitleaks.json \
              --redact=100 \
              --exit-code=0 \
              /workspace

          elif [[ "$EVENT_NAME" == "push" ]] &&
               [[ -n "$BASE_SHA" ]] &&
               [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Escaneando cambios del push: $BASE_SHA..$HEAD_SHA"

            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$REPORT_DIR:/results" \
              zricethezav/gitleaks:latest \
              git \
              --config=/workspace/.github/gitleaks/gitleaks.toml \
              --log-opts="--all ${BASE_SHA}..${HEAD_SHA}" \
              --report-format=json \
              --report-path=/results/gitleaks.json \
              --redact=100 \
              --exit-code=0 \
              /workspace

          else
            echo "Sin rango de commits; escaneando los archivos actuales."

            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$REPORT_DIR:/results" \
              zricethezav/gitleaks:latest \
              dir \
              --config=/workspace/.github/gitleaks/gitleaks.toml \
              --report-format=json \
              --report-path=/results/gitleaks.json \
              --redact=100 \
              --exit-code=0 \
              /workspace
          fi

          test -f "$REPORT"
          jq -e 'type == "array"' "$REPORT" > /dev/null
          echo "report_ready=true" >> "$GITHUB_OUTPUT"

      - name: Guardar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-secrets-results
          path: ${{ runner.temp }}/gitleaks-results/gitleaks.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enviar resultados a DefectDojo
        if: >-
          steps.scan.outputs.report_ready == 'true' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DD_PRODUCT_TYPE: ${{ secrets.DEFECTDOJO_PRODUCT_TYPE_NAME }}
          DD_PRODUCT: ${{ secrets.DEFECTDOJO_PRODUCT_NAME }}
          DD_ENGAGEMENT: ${{ secrets.DEFECTDOJO_ENGAGEMENT_NAME }}
          DD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/gitleaks-results/gitleaks.json"

          [ -f "$REPORT" ] || {
            echo "::error::No se generó gitleaks.json"
            exit 1
          }

          [ -n "$DD_URL" ] || { echo "::error::Falta DEFECTDOJO_URL en Dev"; exit 1; }
          [ -n "$DD_TOKEN" ] || { echo "::error::Falta DEFECTDOJO_API_TOKEN en Dev"; exit 1; }
          [ -n "$DD_PRODUCT_TYPE" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_TYPE_NAME en Dev"; exit 1; }
          [ -n "$DD_PRODUCT" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_NAME en Dev"; exit 1; }
          [ -n "$DD_ENGAGEMENT" ] || { echo "::error::Falta DEFECTDOJO_ENGAGEMENT_NAME en Dev"; exit 1; }

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Enviando reporte Gitleaks: $DD_PRODUCT / $DD_ENGAGEMENT / $BRANCH"

          curl --fail-with-body --silent --show-error \
            --request POST \
            "${DD_URL%/}/api/v2/reimport-scan/" \
            --header "Authorization: Token $DD_TOKEN" \
            --form "scan_type=Gitleaks Scan" \
            --form "product_type_name=$DD_PRODUCT_TYPE" \
            --form "product_name=$DD_PRODUCT" \
            --form "engagement_name=$DD_ENGAGEMENT" \
            --form "test_title=Gitleaks $BRANCH" \
            --form "auto_create_context=true" \
            --form "branch_tag=$BRANCH" \
            --form "commit_hash=$DD_COMMIT" \
            --form "file=@$REPORT;type=application/json"

      - name: Fallar si se encontraron secretos
        if: always() && steps.scan.outputs.report_ready == 'true'
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = (
              Path(os.environ["RUNNER_TEMP"])
              / "gitleaks-results"
              / "gitleaks.json"
          )
          findings = json.loads(report.read_text(encoding="utf-8"))

          if findings:
              print(
                  f"::error::Gitleaks encontró {len(findings)} "
                  "hallazgo(s) en los cambios. El reporte redactado "
                  "se guardó y se envió a DefectDojo."
              )
              raise SystemExit(1)

          print("Gitleaks no encontró secretos en los cambios.")
