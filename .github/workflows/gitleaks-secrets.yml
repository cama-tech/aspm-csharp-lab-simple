name: Analisis de secretos con Gitleaks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks - Secrets
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar reglas
        run: test -f .github/gitleaks/gitleaks.toml

      - name: Preparar resultados
        run: mkdir -p "$RUNNER_TEMP/gitleaks-results"

      - name: Escanear con Gitleaks
        id: scan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          REPORT_DIR="$RUNNER_TEMP/gitleaks-results"
          REPORT="$REPORT_DIR/gitleaks.json"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Escaneando diferencial del PR #$PR_NUMBER: $BASE_SHA..$HEAD_SHA"

            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$REPORT_DIR:/results" \
              zricethezav/gitleaks:latest \
              git \
              --config=/workspace/.github/gitleaks/gitleaks.toml \
              --log-opts="--all ${BASE_SHA}..${HEAD_SHA}" \
              --report-format=json \
              --report-path=/results/gitleaks.json \
              --redact=100 \
              --exit-code=0 \
              /workspace

          else
            echo "Escaneando el estado completo de la rama $REF_NAME."

            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$REPORT_DIR:/results" \
              zricethezav/gitleaks:latest \
              dir \
              --config=/workspace/.github/gitleaks/gitleaks.toml \
              --report-format=json \
              --report-path=/results/gitleaks.json \
              --redact=100 \
              --exit-code=0 \
              /workspace
          fi

          test -f "$REPORT"
          jq -e 'type == "array"' "$REPORT" > /dev/null

          FINDING_COUNT=$(jq 'length' "$REPORT")
          echo "finding_count=$FINDING_COUNT" >> "$GITHUB_OUTPUT"
          echo "report_ready=true" >> "$GITHUB_OUTPUT"

          if [ "$FINDING_COUNT" -gt 0 ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
            echo "Gitleaks encontró $FINDING_COUNT hallazgo(s)."
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            echo "Gitleaks no encontró secretos."
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # El reporte del PR es parcial: no debe cerrar otros hallazgos.
            echo "close_old_findings=false" >> "$GITHUB_OUTPUT"
            echo "test_title=Gitleaks PR #$PR_NUMBER" >> "$GITHUB_OUTPUT"

            if [ "$FINDING_COUNT" -gt 0 ]; then
              echo "send_report=true" >> "$GITHUB_OUTPUT"
            else
              echo "send_report=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$REF_NAME" == "main" ]]; then
            # Reporte completo de main: enviar también [] para cerrar hallazgos corregidos.
            echo "close_old_findings=true" >> "$GITHUB_OUTPUT"
            echo "test_title=Gitleaks main" >> "$GITHUB_OUTPUT"
            echo "send_report=true" >> "$GITHUB_OUTPUT"
          else
            # En una ejecución manual sobre otra rama, no cerrar hallazgos previos.
            echo "close_old_findings=false" >> "$GITHUB_OUTPUT"
            echo "test_title=Gitleaks $REF_NAME" >> "$GITHUB_OUTPUT"

            if [ "$FINDING_COUNT" -gt 0 ]; then
              echo "send_report=true" >> "$GITHUB_OUTPUT"
            else
              echo "send_report=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Guardar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-secrets-results
          path: ${{ runner.temp }}/gitleaks-results/gitleaks.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enviar reporte a DefectDojo
        if: >-
          steps.scan.outputs.report_ready == 'true' &&
          steps.scan.outputs.send_report == 'true' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DD_PRODUCT_TYPE: ${{ secrets.DEFECTDOJO_PRODUCT_TYPE_NAME }}
          DD_PRODUCT: ${{ secrets.DEFECTDOJO_PRODUCT_NAME }}
          DD_ENGAGEMENT: ${{ secrets.DEFECTDOJO_ENGAGEMENT_NAME }}
          DD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          DD_CLOSE_OLD_FINDINGS: ${{ steps.scan.outputs.close_old_findings }}
          DD_TEST_TITLE: ${{ steps.scan.outputs.test_title }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/gitleaks-results/gitleaks.json"

          [ -f "$REPORT" ] || {
            echo "::error::No se generó gitleaks.json"
            exit 1
          }

          [ -n "$DD_URL" ] || { echo "::error::Falta DEFECTDOJO_URL en Dev"; exit 1; }
          [ -n "$DD_TOKEN" ] || { echo "::error::Falta DEFECTDOJO_API_TOKEN en Dev"; exit 1; }
          [ -n "$DD_PRODUCT_TYPE" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_TYPE_NAME en Dev"; exit 1; }
          [ -n "$DD_PRODUCT" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_NAME en Dev"; exit 1; }
          [ -n "$DD_ENGAGEMENT" ] || { echo "::error::Falta DEFECTDOJO_ENGAGEMENT_NAME en Dev"; exit 1; }

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Enviando $DD_TEST_TITLE: $DD_PRODUCT / $DD_ENGAGEMENT"

          curl --fail-with-body --silent --show-error \
            --request POST \
            "${DD_URL%/}/api/v2/reimport-scan/" \
            --header "Authorization: Token $DD_TOKEN" \
            --form "scan_type=Gitleaks Scan" \
            --form "product_type_name=$DD_PRODUCT_TYPE" \
            --form "product_name=$DD_PRODUCT" \
            --form "engagement_name=$DD_ENGAGEMENT" \
            --form "test_title=$DD_TEST_TITLE" \
            --form "auto_create_context=true" \
            --form "close_old_findings=$DD_CLOSE_OLD_FINDINGS" \
            --form "branch_tag=$BRANCH" \
            --form "commit_hash=$DD_COMMIT" \
            --form "file=@$REPORT;type=application/json"

      - name: Fallar si se encontraron secretos
        if: >-
          always() &&
          steps.scan.outputs.report_ready == 'true' &&
          steps.scan.outputs.has_findings == 'true'
        shell: bash
        env:
          FINDING_COUNT: ${{ steps.scan.outputs.finding_count }}
        run: |
          echo "::error::Gitleaks encontró $FINDING_COUNT hallazgo(s)."
          exit 1
