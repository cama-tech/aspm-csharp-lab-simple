name: Analisis de secretos con Gitleaks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks - Secrets
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
        with:
          # Usa el head del PR desde el repositorio base.
          # fetch-depth: 0 también obtiene el historial requerido para el diff.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0

      - name: Preparar resultados
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/gitleaks-results"

      - name: Escanear y filtrar hallazgos
        id: scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          GITLEAKS_IMAGE="zricethezav/gitleaks:v8.28.0"
          REPORT_DIR="$RUNNER_TEMP/gitleaks-results"
          REPORT="$REPORT_DIR/gitleaks.json"
          SCAN_DIR="$RUNNER_TEMP/gitleaks-pr-files"
          SCAN_SOURCE=/workspace
          CONFIG_PATH=/workspace/.github/gitleaks/gitleaks.toml

          mkdir -p "$REPORT_DIR"
          rm -rf "$SCAN_DIR"
          mkdir -p "$SCAN_DIR"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] || {
              echo "::error::No se recibieron los SHA base y head del PR."
              exit 1
            }

            git cat-file -e "$BASE_SHA:.github/gitleaks/gitleaks.toml" 2>/dev/null || {
              echo "::error::La rama base no contiene .github/gitleaks/gitleaks.toml."
              exit 1
            }

            # Usa las reglas de la base para impedir que el PR agregue
            # exclusiones que oculten sus propios hallazgos.
            git show "$BASE_SHA:.github/gitleaks/gitleaks.toml" \
              > "$REPORT_DIR/gitleaks-base.toml"
            CONFIG_PATH=/results/gitleaks-base.toml

            git diff --name-only --diff-filter=ACMRT -z \
              "$BASE_SHA...$HEAD_SHA" > "$REPORT_DIR/changed-files.zlist"

            while IFS= read -r -d '' FILE; do
              SOURCE="$GITHUB_WORKSPACE/$FILE"

              # Omite archivos borrados y symlinks; copia la versión final del PR.
              if [ -f "$SOURCE" ] && [ ! -L "$SOURCE" ]; then
                mkdir -p "$SCAN_DIR/$(dirname "$FILE")"
                cp -- "$SOURCE" "$SCAN_DIR/$FILE"
              fi
            done < "$REPORT_DIR/changed-files.zlist"

            SCAN_SOURCE=/pr-files
            echo "Archivos actuales del PR preparados: $(find "$SCAN_DIR" -type f | wc -l)"
          else
            test -f "$CONFIG_PATH" || {
              echo "::error::No se encontró .github/gitleaks/gitleaks.toml."
              exit 1
            }
            echo "Evento fuera de PR: se escaneará el repositorio actual."
          fi

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$SCAN_DIR:/pr-files:ro" \
            -v "$REPORT_DIR:/results:rw" \
            "$GITLEAKS_IMAGE" \
            detect \
            --no-git \
            --source="$SCAN_SOURCE" \
            --config="$CONFIG_PATH" \
            --report-format=json \
            --report-path=/results/gitleaks.json \
            --redact=100 \
            --exit-code=0

          # Normaliza los reportes limpios que Gitleaks deje vacíos o como null.
          if [ ! -s "$REPORT" ] || jq -e 'type == "null"' "$REPORT" > /dev/null; then
            printf '[]\n' > "$REPORT"
          fi
          jq -e 'type == "array"' "$REPORT" > /dev/null

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 - "$REPORT" "$BASE_SHA" "$HEAD_SHA" <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import PurePosixPath

          report_path, base_sha, head_sha = sys.argv[1:]

          def normalize_report_path(path):
              path = str(path or "").replace("\\", "/")

              # Quita únicamente prefijos absolutos de montaje.
              for prefix in ("/pr-files/", "/workspace/"):
                  if path.startswith(prefix):
                      path = path[len(prefix):]
                      break

              if path.startswith("./"):
                  path = path[2:]

              return PurePosixPath(path).as_posix()

          diff = subprocess.run(
              [
                  "git", "-c", "core.quotePath=false", "diff",
                  "--unified=0", "--no-color", "--diff-filter=ACMRT",
                  f"{base_sha}...{head_sha}", "--",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          added_ranges = {}
          current_file = None

          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  # Git puede agregar un tab al final del encabezado de ruta.
                  current_file = line[6:].split("\t", 1)[0]
                  if current_file.startswith("./"):
                      current_file = current_file[2:]
                  continue

              if line.startswith("+++ "):
                  current_file = None
                  continue

              hunk = re.match(
                  r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@",
                  line,
              )
              if hunk and current_file:
                  start = int(hunk.group(1))
                  count = int(hunk.group(2) or "1")

                  # Hunk de borrado: no hay líneas actuales que escanear.
                  if count > 0:
                      added_ranges.setdefault(current_file, []).append(
                          (start, start + count - 1)
                      )

          with open(report_path, encoding="utf-8") as report:
              findings = json.load(report)

          if findings is None:
              findings = []

          filtered = []
          for finding in findings:
              file_path = normalize_report_path(finding.get("File"))
              ranges = added_ranges.get(file_path, [])

              try:
                  start_line = int(finding.get("StartLine") or 0)
                  end_line = int(finding.get("EndLine") or start_line)
              except (TypeError, ValueError):
                  continue

              overlaps_added_line = any(
                  start_line <= added_end and end_line >= added_start
                  for added_start, added_end in ranges
              )

              if overlaps_added_line:
                  finding["File"] = file_path
                  filtered.append(finding)

          with open(report_path, "w", encoding="utf-8") as report:
              json.dump(filtered, report, indent=2)

          print(f"Hallazgos antes del filtro por líneas: {len(findings)}")
          print(f"Hallazgos en líneas modificadas: {len(filtered)}")
          PY
          fi

          # Redacta valores de Secret y Match antes de publicar el JSON.
          python3 - "$REPORT" <<'PY'
          import json
          import sys

          report_path = sys.argv[1]

          with open(report_path, encoding="utf-8") as report:
              findings = json.load(report)

          def redact(value):
              if isinstance(value, dict):
                  return {
                      key: (
                          "[REDACTED]"
                          if key.lower() in {"secret", "match"}
                          and isinstance(item, str)
                          and item
                          else redact(item)
                      )
                      for key, item in value.items()
                  }
              if isinstance(value, list):
                  return [redact(item) for item in value]
              return value

          with open(report_path, "w", encoding="utf-8") as report:
              json.dump(redact(findings), report, indent=2)
          PY

          jq -e 'type == "array"' "$REPORT" > /dev/null

          FINDING_COUNT=$(jq 'length' "$REPORT")
          echo "finding_count=$FINDING_COUNT" >> "$GITHUB_OUTPUT"
          echo "report_ready=true" >> "$GITHUB_OUTPUT"

          if [ "$FINDING_COUNT" -gt 0 ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Hallazgos que se guardarán y enviarán: $FINDING_COUNT"
          jq -r '.[] | [.RuleID, .File, (.StartLine | tostring)] | @tsv' "$REPORT"

      - name: Guardar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-secrets-results
          path: ${{ runner.temp }}/gitleaks-results/gitleaks.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enviar reporte del PR a DefectDojo
        if: >-
          github.event_name == 'pull_request' &&
          steps.scan.outputs.report_ready == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DD_PRODUCT_TYPE: ${{ secrets.DEFECTDOJO_PRODUCT_TYPE_NAME }}
          DD_PRODUCT: ${{ secrets.DEFECTDOJO_PRODUCT_NAME }}
          DD_ENGAGEMENT: ${{ secrets.DEFECTDOJO_ENGAGEMENT_NAME }}
          DD_COMMIT: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/gitleaks-results/gitleaks.json"

          test -f "$REPORT" || {
            echo "::error::No se generó gitleaks.json"
            exit 1
          }

          [ -n "$DD_URL" ] || { echo "::error::Falta DEFECTDOJO_URL en Dev"; exit 1; }
          [ -n "$DD_TOKEN" ] || { echo "::error::Falta DEFECTDOJO_API_TOKEN en Dev"; exit 1; }
          [ -n "$DD_PRODUCT_TYPE" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_TYPE_NAME en Dev"; exit 1; }
          [ -n "$DD_PRODUCT" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_NAME en Dev"; exit 1; }
          [ -n "$DD_ENGAGEMENT" ] || { echo "::error::Falta DEFECTDOJO_ENGAGEMENT_NAME en Dev"; exit 1; }

          echo "Enviando reporte al Test Gitleaks PR #$PR_NUMBER."

          curl --fail-with-body --silent --show-error \
            --request POST \
            "${DD_URL%/}/api/v2/reimport-scan/" \
            --header "Authorization: Token $DD_TOKEN" \
            --form "scan_type=Gitleaks Scan" \
            --form "product_type_name=$DD_PRODUCT_TYPE" \
            --form "product_name=$DD_PRODUCT" \
            --form "engagement_name=$DD_ENGAGEMENT" \
            --form "test_title=Gitleaks PR #$PR_NUMBER" \
            --form "auto_create_context=true" \
            --form "close_old_findings=true" \
            --form "branch_tag=$PR_BRANCH" \
            --form "commit_hash=$DD_COMMIT" \
            --form "file=@$REPORT;type=application/json"

      - name: Fallar si se encontraron secretos
        if: >-
          always() &&
          steps.scan.outputs.report_ready == 'true' &&
          steps.scan.outputs.has_findings == 'true'
        shell: bash
        env:
          FINDING_COUNT: ${{ steps.scan.outputs.finding_count }}
        run: |
          echo "::error::Gitleaks encontró $FINDING_COUNT hallazgo(s)."
          exit 1
