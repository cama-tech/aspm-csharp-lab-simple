name: Semgrep SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Analyze CSharp with Semgrep
    runs-on: ubuntu-24.04
    environment: Dev

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Record scanner version and commit
        run: |
          semgrep --version
          echo "Commit: $GITHUB_SHA"

      - name: Run Semgrep
        run: |
          test -f .github/semgrep/aspm-rules.yml
          semgrep scan \
            --config auto \
            --config .github/semgrep/aspm-rules.yml \
            --metrics=on \
            --sarif-output=semgrep.sarif \
            --json-output=semgrep.json \
            aspm-csharp-lab-simple/src/AspmLab

      - name: Save reports
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: error

      - name: Send results to DefectDojo
        if: github.event_name != 'pull_request'
        env:
          DD_URL: ${{ vars.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DD_PRODUCT_TYPE: ${{ vars.DEFECTDOJO_PRODUCT_TYPE_NAME }}
          DD_PRODUCT: ${{ vars.DEFECTDOJO_PRODUCT_NAME }}
          DD_ENGAGEMENT: ${{ vars.DEFECTDOJO_ENGAGEMENT_NAME }}
        run: |
          test -s semgrep.json || { echo "::error::No se generó semgrep.json"; exit 1; }
          [ -n "$DD_URL" ] || { echo "::error::Falta DEFECTDOJO_URL en Dev"; exit 1; }
          [ -n "$DD_TOKEN" ] || { echo "::error::Falta DEFECTDOJO_API_TOKEN en Dev"; exit 1; }
          [ -n "$DD_PRODUCT_TYPE" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_TYPE_NAME en Dev"; exit 1; }
          [ -n "$DD_PRODUCT" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_NAME en Dev"; exit 1; }
          [ -n "$DD_ENGAGEMENT" ] || { echo "::error::Falta DEFECTDOJO_ENGAGEMENT_NAME en Dev"; exit 1; }

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Enviando resultados: $DD_PRODUCT / $DD_ENGAGEMENT / Semgrep $BRANCH"

          curl --fail-with-body --silent --show-error \
            --request POST \
            "${DD_URL%/}/api/v2/reimport-scan/" \
            --header "Authorization: Token $DD_TOKEN" \
            --form "scan_type=Semgrep JSON Report" \
            --form "product_type_name=$DD_PRODUCT_TYPE" \
            --form "product_name=$DD_PRODUCT" \
            --form "engagement_name=$DD_ENGAGEMENT" \
            --form "test_title=Semgrep $BRANCH" \
            --form "auto_create_context=true" \
            --form "branch_tag=$BRANCH" \
            --form "commit_hash=$GITHUB_SHA" \
            --form "file=@semgrep.json;type=application/json"
