name: ASPM - SBOM CycloneDX y Grype

on:
  push:
    branches: [main, prueba-codeql]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generar SBOM, analizar y enviar a DefectDojo
    runs-on: ubuntu-latest
    environment: Dev

    env:
      PROJECT_REL: aspm-csharp-lab-simple/src/AspmLab/AspmLab.csproj
      SYFT_IMAGE: anchore/syft:v1.55.0
      GRYPE_IMAGE: anchore/grype:v0.120.1

    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - name: Preparar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Preparar resultados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom-results/grype-db"

      - name: Generar SBOM y analizar con Grype
        id: scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/sbom-results"
          DB_DIR="$OUT/grype-db"
          BASE_DIR="$RUNNER_TEMP/sbom-base"
          PROJECT="$GITHUB_WORKSPACE/$PROJECT_REL"

          mkdir -p "$OUT"

          copy_lock_files() {
            local source_dir="$1"
            local label="$2"
            local destination="$OUT/lockfiles/$label"

            mkdir -p "$destination"

            while IFS= read -r -d '' lock_file; do
              local relative_path="${lock_file#"$source_dir"/}"
              mkdir -p "$destination/$(dirname "$relative_path")"
              cp -- "$lock_file" "$destination/$relative_path"
            done < <(
              find "$source_dir" \
                -type f \
                -name packages.lock.json \
                -not -path '*/bin/*' \
                -not -path '*/obj/*' \
                -print0
            )
          }

          scan_tree() {
            local source_dir="$1"
            local label="$2"
            local update_db="$3"
            local result_dir="$OUT/$label"
            local project_file="$source_dir/$PROJECT_REL"
            local bom="$result_dir/bom.json"
            local grype_report="$result_dir/grype.json"
            local nuget_count

            mkdir -p "$result_dir"

            if [[ -f "$project_file" ]]; then
              echo "Restaurando dependencias de $label"
              dotnet restore "$project_file" \
                --force-evaluate \
                -p:RestorePackagesWithLockFile=true \
                -p:NuGetAudit=false
            elif [[ "$label" == "head" ]]; then
              echo "::error::No se encontró el proyecto esperado: $project_file"
              return 1
            else
              echo "El proyecto no existía en la base; se escanea el árbol disponible."
            fi

            copy_lock_files "$source_dir" "$label"

            docker run --rm \
              -v "$source_dir:/src:ro" \
              "$SYFT_IMAGE" \
              scan dir:/src \
              --exclude "**/bin/**" \
              --exclude "**/obj/**" \
              -o cyclonedx-json \
              > "$bom"

            test -s "$bom"
            jq -e '.bomFormat == "CycloneDX"' "$bom" > /dev/null
            jq -e '(.components // []) | type == "array"' "$bom" > /dev/null

            nuget_count=$(
              jq '[.components[]? | select((.purl // "") | startswith("pkg:nuget/"))] | length' \
                "$bom"
            )
            echo "Paquetes NuGet en SBOM ($label): $nuget_count"

            if [[ "$label" == "head" && "$nuget_count" -eq 0 ]]; then
              echo "::error::Syft no encontró paquetes NuGet en el proyecto del PR."
              echo "::error::Revisa que dotnet restore haya generado packages.lock.json."
              return 1
            elif [[ "$nuget_count" -eq 0 ]]; then
              echo "::warning::El SBOM de $label no contiene paquetes NuGet."
            fi

            echo "Analizando SBOM ($label) con Grype; actualización de DB: $update_db"
            docker run --rm \
              -e GRYPE_DB_CACHE_DIR=/grype-db \
              -e GRYPE_DB_AUTO_UPDATE="$update_db" \
              -v "$DB_DIR:/grype-db:rw" \
              -v "$result_dir:/results:rw" \
              "$GRYPE_IMAGE" \
              sbom:/results/bom.json \
              -o json \
              > "$grype_report"

            test -s "$grype_report"
            jq -e '.matches | type == "array"' "$grype_report" > /dev/null
            echo "Vulnerabilidades en $label: $(jq '.matches | length' "$grype_report")"
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]] || {
              echo "::error::No se recibieron los SHA base y head del PR."
              exit 1
            }

            git cat-file -e "$BASE_SHA^{commit}" || {
              echo "::error::No está disponible el commit base $BASE_SHA."
              exit 1
            }

            MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            echo "Merge-base del PR: $MERGE_BASE"

            git worktree add --detach "$BASE_DIR" "$MERGE_BASE"
            scan_tree "$BASE_DIR" "base" "true"
            scan_tree "$GITHUB_WORKSPACE" "head" "false"

            cp "$OUT/head/grype.json" "$OUT/grype-full.json"

            python3 - \
              "$OUT/base/grype.json" \
              "$OUT/head/grype.json" \
              "$OUT/grype.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          base_path, head_path, output_path = map(Path, sys.argv[1:4])
          base_report = json.loads(base_path.read_text(encoding="utf-8"))
          head_report = json.loads(head_path.read_text(encoding="utf-8"))

          def identity(match):
              vulnerability = match.get("vulnerability", {})
              artifact = match.get("artifact", {})

              package = artifact.get("purl") or "|".join(
                  str(artifact.get(field) or "")
                  for field in ("name", "version", "type")
              )
              locations = sorted({
                  str(location.get("path") or "")
                  for location in artifact.get("locations", [])
                  if location.get("path")
              })

              return (
                  vulnerability.get("id", ""),
                  package,
                  tuple(locations),
              )

          base_findings = {
              identity(match)
              for match in base_report.get("matches", [])
          }

          new_matches = [
              match
              for match in head_report.get("matches", [])
              if identity(match) not in base_findings
          ]

          head_report["matches"] = new_matches
          output_path.write_text(
              json.dumps(head_report, indent=2),
              encoding="utf-8",
          )

          print(f"Hallazgos en base: {len(base_findings)}")
          print(f"Hallazgos nuevos del PR: {len(new_matches)}")
          PY

            git worktree remove --force "$BASE_DIR"
          else
            scan_tree "$GITHUB_WORKSPACE" "head" "true"
            cp "$OUT/head/grype.json" "$OUT/grype-full.json"
            cp "$OUT/head/grype.json" "$OUT/grype.json"
          fi

          jq -e '.matches | type == "array"' "$OUT/grype.json" > /dev/null

          FINDING_COUNT="$(jq '.matches | length' "$OUT/grype.json")"
          echo "finding_count=$FINDING_COUNT" >> "$GITHUB_OUTPUT"
          echo "report_ready=true" >> "$GITHUB_OUTPUT"

          if [[ "$FINDING_COUNT" -gt 0 ]]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Hallazgos del reporte que se enviará: $FINDING_COUNT"

      - name: Mostrar hallazgos nuevos del PR
        if: >-
          github.event_name == 'pull_request' &&
          steps.scan.outputs.report_ready == 'true'
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/sbom-results/grype.json
          PROJECT_REL: ${{ env.PROJECT_REL }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          python3 - "$REPORT" "$PROJECT_REL" "$WORKSPACE" <<'PY'
          import json
          import os
          import sys
          from pathlib import PurePosixPath

          report_path, project_rel, workspace = sys.argv[1:4]
          report = json.loads(open(report_path, encoding="utf-8").read())

          def escape_data(value):
              return (
                  str(value)
                  .replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          def escape_property(value):
              return (
                  escape_data(value)
                  .replace(":", "%3A")
                  .replace(",", "%2C")
              )

          for match in report.get("matches", []):
              vulnerability = match.get("vulnerability", {})
              artifact = match.get("artifact", {})
              vuln_id = vulnerability.get("id", "Vulnerabilidad")
              package = artifact.get("name", "paquete")
              version = artifact.get("version", "")
              severity = str(vulnerability.get("severity", "Unknown")).lower()

              level = {
                  "critical": "error",
                  "high": "error",
                  "medium": "warning",
                  "low": "notice",
                  "negligible": "notice",
              }.get(severity, "warning")

              locations = artifact.get("locations", [])
              path = next(
                  (
                      str(location.get("path") or "")
                      for location in locations
                      if location.get("path")
                  ),
                  "",
              ).replace("\\", "/")

              if path.startswith(workspace.rstrip("/") + "/"):
                  path = path[len(workspace.rstrip("/")) + 1:]
              for prefix in ("/src/", "/repo/"):
                  if path.startswith(prefix):
                      path = path[len(prefix):]

              if path.endswith("/packages.lock.json"):
                  candidate = str(PurePosixPath(path).parent / "AspmLab.csproj")
                  if os.path.isfile(os.path.join(workspace, candidate)):
                      path = candidate

              title = escape_property(vuln_id)
              message = escape_data(
                  f"{vuln_id}: {package} {version} — severidad {severity}"
              )

              if path and not path.startswith("../"):
                  print(
                      f"::{level} file={escape_property(path)},"
                      f"title={title}::{message}"
                  )
              else:
                  print(f"::{level} title={title}::{message}")
          PY

      - name: Guardar SBOM e informes de Grype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspm-sbom-grype
          path: |
            ${{ runner.temp }}/sbom-results/base/bom.json
            ${{ runner.temp }}/sbom-results/base/grype.json
            ${{ runner.temp }}/sbom-results/head/bom.json
            ${{ runner.temp }}/sbom-results/head/grype.json
            ${{ runner.temp }}/sbom-results/grype-full.json
            ${{ runner.temp }}/sbom-results/grype.json
            ${{ runner.temp }}/sbom-results/lockfiles/**
          if-no-files-found: warn
          retention-days: 7

      - name: Enviar reporte a DefectDojo
        if: >-
          always() &&
          steps.scan.outputs.report_ready == 'true' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DD_PRODUCT_TYPE: ${{ secrets.DEFECTDOJO_PRODUCT_TYPE_NAME }}
          DD_PRODUCT: ${{ secrets.DEFECTDOJO_PRODUCT_NAME }}
          DD_ENGAGEMENT: ${{ secrets.DEFECTDOJO_ENGAGEMENT_NAME }}
          DD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/sbom-results/grype.json"

          test -s "$REPORT" || {
            echo "::error::No se generó el reporte filtrado de Grype."
            exit 1
          }

          [ -n "$DD_URL" ] || { echo "::error::Falta DEFECTDOJO_URL en Dev"; exit 1; }
          [ -n "$DD_TOKEN" ] || { echo "::error::Falta DEFECTDOJO_API_TOKEN en Dev"; exit 1; }
          [ -n "$DD_PRODUCT_TYPE" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_TYPE_NAME en Dev"; exit 1; }
          [ -n "$DD_PRODUCT" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_NAME en Dev"; exit 1; }
          [ -n "$DD_ENGAGEMENT" ] || { echo "::error::Falta DEFECTDOJO_ENGAGEMENT_NAME en Dev"; exit 1; }

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BRANCH="$GITHUB_HEAD_REF"
            TEST_TITLE="Grype PR #$PR_NUMBER"
          else
            BRANCH="$GITHUB_REF_NAME"
            TEST_TITLE="Grype $BRANCH"
          fi

          echo "Enviando $TEST_TITLE a DefectDojo"

          curl --fail-with-body --silent --show-error \
            --request POST \
            "${DD_URL%/}/api/v2/reimport-scan/" \
            --header "Authorization: Token $DD_TOKEN" \
            --form "scan_type=Anchore Grype" \
            --form "product_type_name=$DD_PRODUCT_TYPE" \
            --form "product_name=$DD_PRODUCT" \
            --form "engagement_name=$DD_ENGAGEMENT" \
            --form "test_title=$TEST_TITLE" \
            --form "auto_create_context=true" \
            --form "close_old_findings=true" \
            --form "branch_tag=$BRANCH" \
            --form "commit_hash=$DD_COMMIT" \
            --form "file=@$REPORT;type=application/json"

      - name: Fallar si el PR introduce vulnerabilidades
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          steps.scan.outputs.report_ready == 'true' &&
          steps.scan.outputs.has_findings == 'true'
        shell: bash
        env:
          FINDING_COUNT: ${{ steps.scan.outputs.finding_count }}
        run: |
          echo "::error::Grype encontró $FINDING_COUNT vulnerabilidad(es) nuevas respecto al merge-base."
          exit 1
