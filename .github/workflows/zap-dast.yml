name: ASPM - DAST OWASP ZAP

on:
  workflow_dispatch:
  push:
    branches: [main, prueba-codeql]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dast:
    name: OWASP ZAP - DAST
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar resultados
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/dast-results"

      - name: Localizar Dockerfile
        id: dockerfile
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find . -type f -name Dockerfile \
            -not -path './.git/*' \
            | sort | sed -n '1p')

          if [ -z "$FILE" ]; then
            echo "::error::No se encontró un Dockerfile para iniciar la aplicación."
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "context=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Construir aplicación
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -f "${{ steps.dockerfile.outputs.file }}" \
            -t aspm-lab-docker-app:local \
            "${{ steps.dockerfile.outputs.context }}"

      - name: Iniciar aplicación para el escaneo
        shell: bash
        run: |
          set -euo pipefail

          docker network create aspm-dast-network

          docker run -d \
            --name aspm-dast-app \
            --network aspm-dast-network \
            --network-alias app \
            -p 127.0.0.1:8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Lab__EnableControlledCommandEndpoint=true \
            --read-only \
            --tmpfs /tmp \
            aspm-lab-docker-app:local

      - name: Esperar aplicación
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health -o /dev/null; then
              echo "Aplicación disponible."
              exit 0
            fi
            sleep 5
          done

          docker logs aspm-dast-app
          echo "::error::La aplicación no respondió en /health."
          exit 1

      - name: Preparar OpenAPI para ZAP
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/dast-results"

          curl -fsS \
            http://127.0.0.1:8080/swagger/v1/swagger.json \
            -o "$OUT/openapi-original.json"

          jq -e '.paths["/api/lab-results"].delete' \
            "$OUT/openapi-original.json" > /dev/null

          jq '
            .servers = [{"url": "http://app:8080"}]
            | del(.paths["/api/lab-results"].delete)
            | del(.paths["/api/redirect"])
          ' "$OUT/openapi-original.json" > "$OUT/openapi-zap.json"

          jq -e '
            .paths["/api/lab-results"].delete == null
            and .paths["/api/lab-results"].get != null
            and .paths["/api/lab-results"].post != null
            and .paths["/api/redirect"] == null
          ' "$OUT/openapi-zap.json" > /dev/null

          echo "DELETE /api/lab-results y /api/redirect excluidos del escaneo."

      - name: Preparar reglas y configuración de ZAP
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/dast-results"
          mkdir -p "$OUT/scripts"

          cp .github/zap/custom-dast-rules.js "$OUT/scripts/"
          cp .github/zap/zap-automation.yaml "$OUT/"

          test -s "$OUT/scripts/custom-dast-rules.js"
          test -s "$OUT/zap-automation.yaml"

      - name: Ejecutar OWASP ZAP
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/dast-results"

          set +e
          docker run --rm \
            --network aspm-dast-network \
            -u 0:0 \
            -v "$OUT:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-automation.yaml \
            > "$OUT/zap-console.log" 2>&1
          ZAP_EXIT=$?
          set -e

          tail -n 150 "$OUT/zap-console.log" || true
          echo "Código de salida de ZAP: $ZAP_EXIT"
          ls -lah "$OUT"

          if [ "$ZAP_EXIT" -ne 0 ]; then
            echo "::error::ZAP terminó con error. Revisa zap-console.log."
            exit "$ZAP_EXIT"
          fi

          test -s "$OUT/zap-results.json" || {
            echo "::error::No existe o está vacío zap-results.json"
            exit 1
          }

          jq -e '.site | type == "array"' \
            "$OUT/zap-results.json" > /dev/null

          test -s "$OUT/zap-results.xml" || {
            echo "::error::No existe o está vacío zap-results.xml"
            exit 1
          }

          python -c \
            "import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" \
            "$OUT/zap-results.xml"

          grep -Fq '[custom-dast-rules] Evaluando' "$OUT/zap-console.log" || {
            echo "::error::No se encontró evidencia de ejecución de las reglas personalizadas"
            exit 1
          }

          echo "Informes válidos y reglas personalizadas ejecutadas."

      - name: Guardar resultados de ZAP como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspm-dast-zap-results
          path: |
            ${{ runner.temp }}/dast-results/zap-results.json
            ${{ runner.temp }}/dast-results/zap-results.xml
            ${{ runner.temp }}/dast-results/zap-console.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enviar resultados y completar pasos de reproducción en DefectDojo
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DD_PRODUCT_TYPE: ${{ secrets.DEFECTDOJO_PRODUCT_TYPE_NAME }}
          DD_PRODUCT: ${{ secrets.DEFECTDOJO_PRODUCT_NAME }}
          DD_ENGAGEMENT: ${{ secrets.DEFECTDOJO_ENGAGEMENT_NAME }}
          DD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          DD_PATCH_DELAY_SECONDS: "0.2"
          ZAP_XML: ${{ runner.temp }}/dast-results/zap-results.xml
          DD_RESPONSE: ${{ runner.temp }}/dast-results/dd-import-response.json
        shell: bash
        run: |
          set -euo pipefail

          test -s "$ZAP_XML" || {
            echo "::error::No se generó zap-results.xml"
            exit 1
          }

          [ -n "$DD_URL" ] || { echo "::error::Falta DEFECTDOJO_URL en Dev"; exit 1; }
          [ -n "$DD_TOKEN" ] || { echo "::error::Falta DEFECTDOJO_API_TOKEN en Dev"; exit 1; }
          [ -n "$DD_PRODUCT_TYPE" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_TYPE_NAME en Dev"; exit 1; }
          [ -n "$DD_PRODUCT" ] || { echo "::error::Falta DEFECTDOJO_PRODUCT_NAME en Dev"; exit 1; }
          [ -n "$DD_ENGAGEMENT" ] || { echo "::error::Falta DEFECTDOJO_ENGAGEMENT_NAME en Dev"; exit 1; }

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          # Importar el XML de ZAP y guardar la respuesta con el ID del test.
          curl --fail-with-body --silent --show-error \
            --request POST \
            "${DD_URL%/}/api/v2/reimport-scan/" \
            --header "Authorization: Token $DD_TOKEN" \
            --form "scan_type=ZAP Scan" \
            --form "product_type_name=$DD_PRODUCT_TYPE" \
            --form "product_name=$DD_PRODUCT" \
            --form "engagement_name=$DD_ENGAGEMENT" \
            --form "test_title=OWASP ZAP DAST $BRANCH" \
            --form "auto_create_context=true" \
            --form "branch_tag=$BRANCH" \
            --form "commit_hash=$DD_COMMIT" \
            --form "file=@$ZAP_XML;type=application/xml" \
            --output "$DD_RESPONSE"

          cat "$DD_RESPONSE"

          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          base_url = os.environ["DD_URL"].rstrip("/")
          token = os.environ["DD_TOKEN"]
          patch_delay = float(os.environ.get("DD_PATCH_DELAY_SECONDS", "0.2"))

          def api(method, url, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              headers = {
                  "Authorization": f"Token {token}",
                  "Accept": "application/json",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"

              for attempt in range(5):
                  request = urllib.request.Request(
                      url, data=data, headers=headers, method=method
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          content = response.read()
                          return json.loads(content) if content else {}
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 4:
                          detail = error.read().decode("utf-8", errors="replace")
                          raise RuntimeError(
                              f"DefectDojo respondió HTTP {error.code}: {detail}"
                          ) from error

                      try:
                          wait_seconds = float(error.headers.get("Retry-After", ""))
                      except (TypeError, ValueError):
                          wait_seconds = min(2 ** attempt, 30)

                      print(
                          f"HTTP {error.code}; reintentando en "
                          f"{wait_seconds:g} segundos..."
                      )
                      time.sleep(wait_seconds)

          def normalize_title(value):
              return " ".join((value or "").casefold().split())

          with open(os.environ["DD_RESPONSE"], encoding="utf-8") as file:
              imported = json.load(file)

          test_id = imported.get("test") or imported.get("test_id")
          if isinstance(test_id, dict):
              test_id = test_id.get("id")
          if not test_id:
              raise SystemExit(
                  f"No se encontró el ID del test en la respuesta: {imported}"
              )

          # Preparar los pasos de reproducción desde las instancias del XML.
          root = ET.parse(os.environ["ZAP_XML"]).getroot()
          report_findings = {}

          for item in root.findall("./site/alerts/alertitem"):
              title = (item.findtext("alert") or "").strip()
              rule_id = (item.findtext("pluginid") or "").strip()
              instances = []

              for instance in item.findall("./instances/instance"):
                  method = (instance.findtext("method") or "HTTP").strip()
                  uri = (instance.findtext("uri") or "").strip()
                  param = (instance.findtext("param") or "").strip()
                  attack = (instance.findtext("attack") or "").strip()
                  evidence = (instance.findtext("evidence") or "").strip()

                  lines = [f"Enviar una solicitud {method} a: {uri}"]
                  if param:
                      lines.append(f"Parámetro: {param}")
                  if attack:
                      lines.append(f"Valor enviado: {attack}")
                  if evidence:
                      lines.append(f"Evidencia observada: {evidence}")

                  instances.append("\n".join(lines))

              if title and rule_id and instances:
                  report_findings.setdefault((rule_id, title), []).extend(instances)

          if not report_findings:
              raise SystemExit("El XML de ZAP no contiene instancias para reproducir.")

          expected_keys = {
              (rule_id, normalize_title(title))
              for rule_id, title in report_findings
          }

          # Consultar todos los findings asociados al test, siguiendo la paginación.
          findings = []
          for attempt in range(12):
              url = (
                  f"{base_url}/api/v2/findings/?"
                  + urllib.parse.urlencode({"test": test_id, "limit": 200})
              )
              findings = []

              while url:
                  page = api("GET", url)
                  findings.extend(page.get("results", []))
                  url = page.get("next")

              found_keys = {
                  (
                      str(finding.get("vuln_id_from_tool") or "").strip(),
                      normalize_title(finding.get("title")),
                  )
                  for finding in findings
              }

              if expected_keys.issubset(found_keys):
                  break
              if attempt < 11:
                  time.sleep(5)

          updated = 0
          missing = []

          for (rule_id, title), instances in report_findings.items():
              matches = [
                  finding for finding in findings
                  if str(finding.get("vuln_id_from_tool") or "").strip() == rule_id
                  and normalize_title(finding.get("title")) == normalize_title(title)
              ]

              if not matches:
                  missing.append(f"{rule_id}: {title}")
                  continue

              steps = (
                  f"Hallazgo detectado por OWASP ZAP. Regla: {rule_id}.\n\n"
                  + "\n\n".join(
                      f"Instancia {number}:\n{details}"
                      for number, details in enumerate(instances, start=1)
                  )
              )

              for finding in matches:
                  api(
                      "PATCH",
                      f"{base_url}/api/v2/findings/{finding['id']}/",
                      {"steps_to_reproduce": steps},
                  )
                  updated += 1
                  print(f"Actualizado finding {finding['id']}: {finding.get('title')}")
                  time.sleep(patch_delay)

          if missing:
              raise SystemExit(
                  "No se encontraron findings importados para: "
                  + "; ".join(missing)
              )

          print(f"Pasos de reproducción actualizados en {updated} findings.")
          PY

      - name: Mostrar logs si falla
        if: failure()
        shell: bash
        run: |
          tail -n 150 "$RUNNER_TEMP/dast-results/zap-console.log" || true
          docker logs aspm-dast-app || true

      - name: Detener aplicación
        if: always()
        shell: bash
        run: |
          docker rm -f aspm-dast-app || true
          docker network rm aspm-dast-network || true
