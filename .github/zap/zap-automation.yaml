env:
  contexts:
    - name: aspm-lab
      urls:
        - http://app:8080
      includePaths:
        - http://app:8080.*
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  - type: openapi
    parameters:
      apiFile: /zap/wrk/openapi-zap.json
      targetUrl: http://app:8080
      context: aspm-lab

  - type: script
    parameters:
      action: add
      type: active
      engine: "ECMAScript : GraalVM JavaScript"
      name: custom-dast-rules
      file: /zap/wrk/scripts/custom-dast-rules.js

  - type: script
    parameters:
      action: enable
      type: active
      name: custom-dast-rules

  - type: activeScan
    parameters:
      context: aspm-lab

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-results.json
      reportTitle: ASPM DAST Report

  - type: report
    parameters:
      template: traditional-xml
      reportDir: /zap/wrk
      reportFile: zap-results.xml
      reportTitle: ASPM DAST Report
    risks:
      - high
      - medium
      - low
      - info
    confidences:
      - high
      - medium
      - low
      - falsepositive
